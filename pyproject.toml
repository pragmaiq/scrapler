[project]
name = "scrapler"
version = "0.1.0"
description = ""

requires-python = ">=3.14"
dependencies = []

[project.scripts]
scrapler = "scrapler.cli:app"
 
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
 
[tool.hatch.build.targets.wheel]
packages = ["src/scrapler"]
 
[tool.ruff]
line-length = 100
target-version = "py314"
 
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]