[project]
name = "scrapler"
version = "0.1.0"
description = ""

requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "datasets>=5.0.1",
    "google-api-python-client>=2.198.0",
    "httpx>=0.28.1",
    "langdetect>=1.0.9",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
scrapler = "scrapler.cli:app"
 
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
 
[tool.hatch.build.targets.wheel]
packages = ["src/scrapler"]
 
[tool.ruff]
line-length = 100
target-version = "py314"
 
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
